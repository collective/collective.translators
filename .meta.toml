# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.11.1"

[pyproject]
extra_lines = """
[tool.pytest.ini_options]
testpaths = "tests"
"""
codespell_skip = "*.min.js"
codespell_ignores = "vew"
dependencies_mappings = []
# 'services' is tests/services.py, a local helper module, not a distribution.
dependencies_ignores = "['plone.app.iterate', 'plone.app.upgrade', 'plone.volto', 'zestreleaser.towncrier', 'zest.releaser', 'zest.pocompile', 'pytest-cov', 'boto3', 'deepl', 'ollama', 'openai', 'services']"

[gitignore]
extra_lines = """
.lock
.mxdev_cache/
.venv/
temp_auto_push.bat
temp_interactive_push.bat
"""

[tox]
test_runner = "pytest"
test_path = "/tests"
use_mxdev = true
# The add-on needs plone.app.multilingual with IExternalTranslationService,
# which is not in any release yet, so the tests run against the branch of
# https://github.com/plone/plone.app.multilingual/pull/468 checked out by mxdev.
constraints_file = "constraints-mxdev.txt"
test_deps_additional = """
    -esources/plone.app.multilingual[test]
"""
# pip refuses an editable requirement inside the constraints file that tox
# generates for the package deps.
constrain_package_deps = "false"
# "*" would add 3.14, which requires-python excludes.
test_matrix = { "6.2" = ["3.13", "3.12", "3.11", "3.10"] }
# Without it config-package takes the package name from the directory name,
# which is wrong in a worktree.
package_name = "collective.translators"

# The default environments install every service library, so the tests that need
# them run. The ``minimal`` environment installs none, to cover the case where
# the libraries are missing and the service profiles are not registered.
test_extras = """
    test
    services
"""
extra_lines = """
[testenv:minimal]
description = run the tests without the optional service libraries
use_develop = {[base]use_develop}
skip_install = {[base]skip_install}
constrain_package_deps = {[base]constrain_package_deps}
set_env = {[base]set_env}
deps = {[base]deps}
commands = {[test_runner]test}
extras = test
"""

[github]
extra_lines = """
    - name: Test without the optional service libraries
      run: uvx --with tox-uv tox -e minimal
"""
py_versions = "[\"3.12\", \"3.11\", \"3.10\"]"
jobs = ["qa", "release_ready"]
