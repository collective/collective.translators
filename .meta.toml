# Generated from:
# https://github.com/plone/meta/tree/main/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.3.0"

[pyproject]
codespell_skip = "*.min.js"
codespell_ignores = "vew"
dependencies_mappings = []
dependencies_ignores = "['plone.app.iterate', 'plone.app.upgrade', 'plone.volto', 'zestreleaser.towncrier', 'zest.releaser', 'pytest-cov', 'boto3', 'deepl', 'ollama', 'openai']"

[gitignore]
extra_lines = """
.lock
.mxdev_cache/
.venv/
"""

[tox]
test_runner = "pytest"
test_path = "/tests"
use_mxdev = true
# The add-on needs plone.app.multilingual with IExternalTranslationService,
# which is not in any release yet, so the tests run against the branch of
# https://github.com/plone/plone.app.multilingual/pull/468 checked out by mxdev.
constraints_file = "constraints-mxdev.txt"
test_deps_additional = """
    -esources/plone.app.multilingual[test]
"""
# pip refuses an editable requirement inside the constraints file that tox
# generates for the package deps.
constrain_package_deps = false
test_matrix = { "6.2" = ["*"] }

[github]
py_versions = "[\"3.12\", \"3.11\", \"3.10\"]"
jobs = ["qa", "release_ready"]
